services:
  mcp-server:
    build:
      context: .
      dockerfile: src/Portfolio.Mcp.Server/Dockerfile
    container_name: portfolio-mcp-server
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_URLS: "http://+:5002"
      Orders__BaseUrl: "http://host.docker.internal:8080"
      Orders__TokenUrl: "http://host.docker.internal:5001/connect/token"
